<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 65 950 935">
  <!--
    Color marks what kind of thing something is: accent (purple) boxes are AI
    agents, alt (white) boxes are deterministic systems, and the default
    (green) is the data flowing between them.
  -->
  <!-- Styled by the .diagram rules in static/styles.css; see content/diagrams/README.md -->

  <!-- world builder -->
  <rect class="box accent" x="60" y="80" width="280" height="110" />
  <text class="title accent" x="200" y="110">world builder</text>
  <text class="accent" x="200" y="142">free-text world prompt</text>
  <text class="accent" x="200" y="167">once per campaign</text>

  <!-- world store -->
  <rect class="box alt" x="650" y="80" width="290" height="110" />
  <text class="title alt" x="795" y="110">world store</text>
  <text class="alt" x="795" y="142">durable world state</text>
  <text class="alt" x="795" y="167">vector store / RAG</text>

  <!-- session prepper -->
  <rect class="box accent" x="60" y="310" width="280" height="110" />
  <text class="title accent" x="200" y="340">session prepper</text>
  <text class="accent" x="200" y="372">prior session context</text>
  <text class="accent" x="200" y="397">plans, voices, stats</text>

  <!-- overseer -->
  <rect class="box accent" x="650" y="310" width="290" height="110" />
  <text class="title accent" x="795" y="340">overseer</text>
  <text class="accent" x="795" y="372">knows the full plan</text>
  <text class="accent" x="795" y="397">retrieves context</text>

  <!-- storyteller -->
  <rect class="box accent" x="360" y="560" width="280" height="120" />
  <text class="title accent" x="500" y="590">storyteller</text>
  <text class="accent" x="500" y="622">limited starting context</text>
  <text class="accent" x="500" y="647">no planned plot</text>

  <!-- scribe -->
  <rect class="box accent" x="60" y="820" width="280" height="110" />
  <text class="title accent" x="200" y="850">scribe</text>
  <text class="accent" x="200" y="882">records new facts</text>
  <text class="accent" x="200" y="907">asynchronously</text>

  <!-- combat engine -->
  <rect class="box alt" x="650" y="820" width="290" height="110" />
  <text class="title alt" x="795" y="850">combat engine / UI</text>
  <text class="alt" x="795" y="882">voxel battlemaps</text>
  <text class="alt" x="795" y="907">deterministic rules</text>

  <!-- world builder -> world store -->
  <polyline class="line" points="340,135 650,135" />
  <polygon class="head" points="650,135 641,139.5 641,130.5" />
  <text x="495" y="111">creates world</text>

  <!-- world store -> session prepper -->
  <polyline class="line" points="650,165 495,165 495,235 200,235 200,310" />
  <polygon class="head" points="200,310 195.5,301 204.5,301" />
  <text x="302" y="214">world + characters</text>

  <!-- session prepper -> overseer -->
  <polyline class="line" points="340,365 650,365" />
  <polygon class="head" points="650,365 641,369.5 641,360.5" />
  <text x="495" y="341">full session prep</text>

  <!-- world store <-> overseer -->
  <polyline class="line" points="795,190 795,310" />
  <polygon class="head" points="795,310 790.5,301 799.5,301" />
  <polygon class="head" points="795,190 799.5,199 790.5,199" />
  <text class="start" x="810" y="251">retrieval</text>

  <!-- session prepper -> storyteller -->
  <polyline class="line" points="200,420 200,610 360,610" />
  <polygon class="head" points="360,610 351,614.5 351,605.5" />
  <text class="end" x="180" y="479">limited</text>
  <text class="end" x="180" y="504">context</text>

  <!-- overseer <-> storyteller -->
  <polyline class="line" points="795,420 795,610 640,610" />
  <polygon class="head" points="640,610 649,605.5 649,614.5" />
  <polygon class="head" points="795,420 799.5,429 790.5,429" />
  <text class="end" x="775" y="479">stage directions</text>
  <text class="end" x="775" y="504">/ story feedback</text>

  <!-- storyteller -> scribe -->
  <polyline class="line" points="425,680 425,745 200,745 200,820" />
  <polygon class="head" points="200,820 195.5,811 204.5,811" />
  <text x="243" y="718">improvised facts</text>

  <!-- storyteller <-> combat engine -->
  <polyline class="line" points="575,680 575,745 795,745 795,820" />
  <polygon class="head" points="795,820 790.5,811 799.5,811" />
  <polygon class="head" points="575,680 579.5,689 570.5,689" />
  <text x="763" y="718">scene / results</text>

  <!-- scribe -> world store -->
  <polyline class="line"
    points="200,930 200,985 975,985 975,135 940,135" />
  <polygon class="head" points="940,135 949,130.5 949,139.5" />
  <text x="571" y="963">new facts become durable canon</text>
</svg>
